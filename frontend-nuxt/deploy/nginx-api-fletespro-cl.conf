# API: api.fletespro.cl → Express (PM2 portespro-backend, PORT 3002 en ecosystem.config.js)
# Instalar: sudo cp ... /etc/nginx/sites-available/api.fletespro.cl && sudo nginx -t && sudo systemctl reload nginx

server {
    server_name api.fletespro.cl;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.fletespro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fletespro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.fletespro.cl) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.fletespro.cl;
    return 404;
}
