# Nginx: fletespro.cl y www.fletespro.cl → Nuxt (puerto 3003) con SSL
# Certificado: Let's Encrypt (/etc/letsencrypt/live/fletespro.cl/)

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fletespro.cl www.fletespro.cl;
    return 301 https://$host$request_uri;
}

# HTTPS: fletespro.cl
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fletespro.cl;
    ssl_certificate     /etc/letsencrypt/live/fletespro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletespro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/fletespro.cl.access.log;
    error_log  /var/log/nginx/fletespro.cl.error.log;

    # Servir chunks JS/CSS directamente con MIME correcto (evita application/json de Nitro)
    location /_nuxt/ {
        alias /var/www/html/fletesproweb/frontend-nuxt/.output/public/_nuxt/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# HTTPS: www.fletespro.cl
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fletespro.cl;
    ssl_certificate     /etc/letsencrypt/live/fletespro.cl/fullchain.pem;
